<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pogoda.gay</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { scrollbar-width: none; -ms-overflow-style: none; }
  html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; width: 0; height: 0; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    padding: 30px 20px 60px;
    background: linear-gradient(160deg, #4a90e2 0%, #7bb3f0 100%);
    color: #fff;
    transition: background 1.2s ease;
    position: relative;
    overflow-x: hidden;
  }
  body::before, body::after {
    content: ''; position: fixed; border-radius: 50%;
    filter: blur(100px); opacity: 0.4; pointer-events: none; z-index: 0;
  }
  body::before { width: 500px; height: 500px; top: -150px; left: -150px; background: rgba(255,255,255,0.5); }
  body::after { width: 600px; height: 600px; bottom: -200px; right: -200px; background: rgba(255,255,255,0.3); }
  body.rain    { background: linear-gradient(160deg, #3b5a78 0%, #56799c 100%); }
  body.thunder { background: linear-gradient(160deg, #2c2e4a 0%, #4a3f6b 100%); }
  body.clear   { background: linear-gradient(160deg, #4a90e2 0%, #7bb3f0 100%); }
  .wrap { position: relative; z-index: 2; max-width: 1100px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 26px; }
  .header .title { font-size: 22px; font-weight: 700; letter-spacing: 1.5px; opacity: 0.95; margin-bottom: 16px; }
  .now {
    display: inline-flex; align-items: center; gap: 22px;
    background: rgba(255,255,255,0.14);
    backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 28px; padding: 22px 34px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    animation: fadeIn 0.7s ease;
  }
  .now .icon { font-size: 66px; line-height: 1; filter: drop-shadow(0 8px 20px rgba(0,0,0,0.25)); transition: transform 0.4s ease; }
  .now .icon.pulse { transform: scale(1.18); }
  .now .info { text-align: left; }
  .now .state { font-size: 30px; font-weight: 600; letter-spacing: 0.3px; }
  .now .meta { font-size: 13px; opacity: 0.85; margin-top: 6px; line-height: 1.6; }
  .now .timer-block { margin-left: 18px; padding-left: 22px; border-left: 1px solid rgba(255,255,255,0.25); text-align: center; }
  .now .timer-label { font-size: 11px; opacity: 0.7; text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 4px; }
  .now .timer { font-size: 28px; font-weight: 300; font-variant-numeric: tabular-nums; letter-spacing: 1.5px; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .day-title { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; letter-spacing: 0.5px; margin: 26px 0 12px 6px; opacity: 0.95; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 10px; background: rgba(255,255,255,0.10);
    backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 24px; padding: 16px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.25);
  }
  .tile {
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px; padding: 11px 6px 10px; text-align: center;
    transition: transform 0.25s ease, background 0.25s ease;
    animation: pop 0.35s ease;
  }
  .tile:hover { transform: translateY(-4px); background: rgba(255,255,255,0.15); }
  .tile.current { background: rgba(255,255,255,0.3); border-color: rgba(255,255,255,0.55); box-shadow: 0 10px 26px rgba(0,0,0,0.22); }
  .tile.past { opacity: 0.5; }
  @keyframes pop { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
  .tile .time { font-size: 12px; opacity: 0.85; font-variant-numeric: tabular-nums; margin-bottom: 6px; }
  .tile .t-icon { font-size: 24px; line-height: 1; margin-bottom: 6px; }
  .tile .t-name { font-size: 10px; opacity: 0.9; margin-bottom: 4px; }
  .tile .t-extra { font-size: 10px; opacity: 0.7; display: flex; flex-direction: column; gap: 1px; margin-top: 3px; border-top: 1px solid rgba(255,255,255,0.12); padding-top: 4px; }
  .tile .t-extra span { white-space: nowrap; }
  .clouds-layer { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; opacity: 0; transition: opacity 1s ease; }
  .clouds-layer.on { opacity: 1; }
  .cloud-css {
    position: absolute; background: rgba(255,255,255,0.85); border-radius: 100px;
    filter: blur(1px); box-shadow: 0 10px 30px rgba(255,255,255,0.3), inset 0 -8px 20px rgba(200,220,255,0.4);
    animation: drift linear infinite;
  }
  .cloud-css::before, .cloud-css::after { content: ''; position: absolute; background: inherit; border-radius: 50%; box-shadow: inherit; }
  .cloud-css::before { width: 60%; height: 130%; top: -55%; left: 10%; }
  .cloud-css::after { width: 45%; height: 110%; top: -40%; right: 12%; }
  @keyframes drift { from { transform: translateX(-250px); } to { transform: translateX(calc(100vw + 250px)); } }
  .rain-layer { position: fixed; inset: 0; pointer-events: none; z-index: 3; overflow: hidden; opacity: 0; transition: opacity 0.8s ease; }
  .rain-layer.on { opacity: 1; }
  .drop {
    position: absolute; top: -20px; width: 2px; height: 18px;
    background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(180,220,255,0.9) 100%);
    border-radius: 2px; animation: fall linear infinite;
  }
  @keyframes fall { to { transform: translateY(105vh); } }
  .flash { position: fixed; inset: 0; background: rgba(255,255,255,0.85); opacity: 0; pointer-events: none; z-index: 4; }
  .flash.on { animation: lightning 0.35s ease-out; }
  @keyframes lightning { 0% { opacity: 0; } 10% { opacity: 0.9; } 25% { opacity: 0.1; } 40% { opacity: 0.8; } 100% { opacity: 0; } }
  .secret-btn {
    position: fixed; right: 14px; bottom: 14px; width: 26px; height: 26px; border-radius: 50%;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
    cursor: pointer; z-index: 20; transition: all 0.3s ease;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; opacity: 0.25; color: #fff;
  }
  .secret-btn:hover { opacity: 0.8; background: rgba(255,255,255,0.15); transform: scale(1.1); }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    z-index: 30; display: none; align-items: center; justify-content: center;
    padding: 20px; opacity: 0; transition: opacity 0.3s ease;
  }
  .modal-overlay.on { display: flex; opacity: 1; }
  .modal {
    background: rgba(20,25,40,0.95); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 24px; padding: 32px; max-width: 380px; width: 100%;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5); animation: modalPop 0.35s ease;
  }
  @keyframes modalPop { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  .modal h2 { font-size: 20px; margin-bottom: 8px; text-align: center; }
  .modal p { font-size: 13px; opacity: 0.7; text-align: center; margin-bottom: 20px; }
  .code-input {
    width: 100%; padding: 14px 16px; border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08);
    color: #fff; font-size: 18px; text-align: center; letter-spacing: 4px;
    font-variant-numeric: tabular-nums; outline: none; transition: border 0.2s ease; font-family: inherit;
  }
  .code-input:focus { border-color: rgba(120,200,255,0.7); background: rgba(255,255,255,0.12); }
  .modal-btns { display: flex; gap: 10px; margin-top: 18px; }
  .modal-btn {
    flex: 1; padding: 12px; border: none; border-radius: 12px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    transition: transform 0.15s ease; font-family: inherit; color: #fff;
  }
  .modal-btn:hover { transform: translateY(-2px); }
  .modal-btn.submit { background: linear-gradient(135deg, #4caf50, #66bb6a); }
  .modal-btn.cancel { background: rgba(255,255,255,0.1); }
  .modal-error { color: #ff6b6b; font-size: 13px; text-align: center; margin-top: 12px; min-height: 18px; }
  .admin-panel {
    position: fixed; right: 20px; bottom: 60px; z-index: 25;
    display: none; flex-direction: column; gap: 8px;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 18px; padding: 12px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.4);
    animation: modalPop 0.35s ease;
  }
  .admin-panel.on { display: flex; }
  .admin-title { font-size: 11px; opacity: 0.7; text-transform: uppercase; letter-spacing: 1.2px; text-align: center; margin-bottom: 4px; }
  .admin-btn {
    padding: 10px 18px; border: none; border-radius: 10px;
    font-size: 13px; font-weight: 600; color: #fff;
    cursor: pointer; transition: transform 0.15s ease;
    font-family: inherit; white-space: nowrap; min-width: 130px;
  }
  .admin-btn:hover { transform: translateY(-2px); }
  .admin-btn:active { transform: translateY(0); }
  .admin-btn.clear   { background: linear-gradient(135deg, #4caf50, #66bb6a); }
  .admin-btn.rain    { background: linear-gradient(135deg, #2196f3, #42a5f5); }
  .admin-btn.thunder { background: linear-gradient(135deg, #9c27b0, #ba68c8); }
  .admin-status { font-size: 10px; opacity: 0.6; text-align: center; margin-top: 4px; min-height: 12px; }
  @media (max-width: 600px) {
    .now { flex-wrap: wrap; justify-content: center; padding: 18px 22px; gap: 14px; }
    .now .timer-block { border: none; margin: 0; padding: 0; width: 100%; }
    .now .icon { font-size: 54px; }
    .now .state { font-size: 24px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; }
    .admin-panel { right: 10px; bottom: 50px; }
    .admin-btn { min-width: 100px; padding: 8px 12px; font-size: 12px; }
  }
</style>
</head>
<body class="clear">

<div class="clouds-layer" id="cloudsLayer"></div>
<div class="rain-layer" id="rainLayer"></div>
<div class="flash" id="flash"></div>

<div class="wrap">
  <div class="header">
    <div class="title">Pogoda.gay</div>
    <div class="now">
      <div class="icon" id="current-icon">☀️</div>
      <div class="info">
        <div class="state" id="current-state">Ясно</div>
        <div class="meta" id="current-meta">Нажмите на панель управления, чтобы сменить</div>
      </div>
    </div>
  </div>

  <div id="days"></div>
</div>

<div class="secret-btn" onclick="openCodeModal()" title="•••">•</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>🔐 Введите код</h2>
    <p>Для доступа к управлению погодой</p>
    <input type="password" class="code-input" id="codeInput" maxlength="8" placeholder="••••••••" autocomplete="off" onkeydown="if(event.key==='Enter') submitCode()">
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeCodeModal()">Отмена</button>
      <button class="modal-btn submit" onclick="submitCode()">Войти</button>
    </div>
    <div class="modal-error" id="modalError"></div>
  </div>
</div>

<div class="admin-panel" id="adminPanel">
  <div class="admin-title">Управление</div>
  <button class="admin-btn clear"   onclick="adminSetWeather('clear')">☀️ Ясно</button>
  <button class="admin-btn rain"    onclick="adminSetWeather('rain')">🌧️ Дождь</button>
  <button class="admin-btn thunder" onclick="adminSetWeather('thunder')">⛈️ Гроза</button>
  <div class="admin-status" id="adminStatus"></div>
</div>

<script>
const SERVER_HOST = 'x1.qwertyx.host';
const SERVER_PORT = 29323;
const SECRET_KEY  = '1325201155915591';
const API_URL     = `http://${SERVER_HOST}:${SERVER_PORT}/execute`;
const ADMIN_CODE = '55915591';

const WEATHERS = {
  clear:   { type: 'clear',   icon: '☀️',  name: 'Ясно'   },
  rain:    { type: 'rain',    icon: '🌧️', name: 'Дождь'  },
  thunder: { type: 'thunder', icon: '⛈️', name: 'Гроза'  }
};

let adminUnlocked = false;

function openCodeModal() {
  const modal = document.getElementById('modalOverlay');
  const input = document.getElementById('codeInput');
  const err = document.getElementById('modalError');
  input.value = ''; err.textContent = '';
  modal.classList.add('on');
  setTimeout(() => input.focus(), 100);
}

function closeCodeModal() {
  document.getElementById('modalOverlay').classList.remove('on');
}

function submitCode() {
  const val = document.getElementById('codeInput').value.trim();
  if (val === ADMIN_CODE) {
    adminUnlocked = true;
    closeCodeModal();
    document.getElementById('adminPanel').classList.add('on');
  } else {
    document.getElementById('modalError').textContent = 'Неверный код';
    document.getElementById('codeInput').value = '';
  }
}

document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'modalOverlay') closeCodeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeCodeModal();
});

async function adminSetWeather(type) {
  if (!adminUnlocked) return;
  const w = WEATHERS[type];
  if (!w) return;

  applyWeatherVisual(w);

  const status = document.getElementById('adminStatus');
  status.textContent = 'Отправка...';
  const ok = await sendCommand(type);
  status.textContent = ok ? '✓ Отправлено' : '✗ Ошибка сети';
  setTimeout(() => { status.textContent = ''; }, 2500);
}

function makeClouds(count = 8) {
  const layer = document.getElementById('cloudsLayer');
  layer.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const c = document.createElement('div');
    c.className = 'cloud-css';
    const w = 90 + Math.random() * 140;
    c.style.width = w + 'px';
    c.style.height = (w * 0.28) + 'px';
    c.style.top = (Math.random() * 70) + 'vh';
    c.style.opacity = 0.45 + Math.random() * 0.5;
    c.style.animationDuration = (40 + Math.random() * 60) + 's';
    c.style.animationDelay = (-Math.random() * 60) + 's';
    c.style.transform = `scale(${0.7 + Math.random() * 0.6})`;
    layer.appendChild(c);
  }
}

function setClouds(active) {
  const layer = document.getElementById('cloudsLayer');
  if (active) { makeClouds(); layer.classList.add('on'); }
  else { layer.classList.remove('on'); setTimeout(() => { layer.innerHTML = ''; }, 1000); }
}

function makeRain(intensity = 60) {
  const layer = document.getElementById('rainLayer');
  layer.innerHTML = '';
  for (let i = 0; i < Math.floor(intensity); i++) {
    const drop = document.createElement('div');
    drop.className = 'drop';
    drop.style.left = Math.random() * 100 + 'vw';
    drop.style.height = (12 + Math.random() * 14) + 'px';
    drop.style.animationDuration = (0.5 + Math.random() * 0.5) + 's';
    drop.style.animationDelay = (Math.random() * 2) + 's';
    drop.style.opacity = 0.4 + Math.random() * 0.6;
    layer.appendChild(drop);
  }
}

function setRain(active, intensity = 60) {
  const layer = document.getElementById('rainLayer');
  if (active) { makeRain(intensity); layer.classList.add('on'); }
  else { layer.classList.remove('on'); setTimeout(() => { layer.innerHTML = ''; }, 800); }
}

let lightningTimer = null;

function startLightning() {
  stopLightning();
  const flash = document.getElementById('flash');
  const trigger = () => {
    flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on');
  };
  const loop = () => { trigger(); lightningTimer = setTimeout(loop, 4000 + Math.random() * 6000); };
  lightningTimer = setTimeout(loop, 1500 + Math.random() * 3000);
}

function stopLightning() {
  if (lightningTimer) clearTimeout(lightningTimer);
  lightningTimer = null;
  document.getElementById('flash').classList.remove('on');
}

async function sendCommand(type) {
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Connector-Key': SECRET_KEY
      },
      body: JSON.stringify({ command: `execute in minecraft:overworld run weather ${type}` })
    });
    return res.ok;
  } catch (e) {
    console.error('Ошибка отправки:', e);
    return false;
  }
}

function applyWeatherVisual(w) {
  document.getElementById('current-icon').textContent = w.icon;
  document.getElementById('current-state').textContent = w.name;

  const icon = document.getElementById('current-icon');
  icon.classList.add('pulse');
  setTimeout(() => icon.classList.remove('pulse'), 400);

  document.body.classList.remove('clear', 'rain', 'thunder');
  document.body.classList.add(w.type);

  if (w.type === 'clear') { setRain(false); stopLightning(); setClouds(true); }
  else if (w.type === 'rain') { setRain(true, 50); stopLightning(); setClouds(true); }
  else if (w.type === 'thunder') { setRain(true, 80); startLightning(); setClouds(true); }
}

// Просто показываем сетку-заглушку (без генерации случайной погоды)
function renderStubGrid() {
  const container = document.getElementById('days');
  container.innerHTML = '';
  const now = new Date();
  const start = new Date(now); start.setHours(0,0,0,0);
  const nowHour = now.getHours();

  for (let day = 0; day < 2; day++) {
    const dayStart = new Date(start); dayStart.setDate(start.getDate() + day);
    const dateStr = `${String(dayStart.getDate()).padStart(2,'0')}.${String(dayStart.getMonth()+1).padStart(2,'0')}`;
    const dayName = day === 0 ? 'Сегодня' : 'Завтра';

    const title = document.createElement('div');
    title.className = 'day-title';
    title.innerHTML = `<span>${dayName}, ${dateStr}</span>`;
    container.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'grid';

    for (let h = 0; h < 24; h++) {
      const tile = document.createElement('div');
      tile.className = 'tile' + (day === 0 && h === nowHour ? ' current' : '') + (day === 0 && h < nowHour ? ' past' : '');
      tile.innerHTML = `
        <div class="time">${day === 0 && h === nowHour ? 'Сейчас' : String(h).padStart(2,'0') + ':00'}</div>
        <div class="t-icon">—</div>
        <div class="t-name">—</div>
        <div class="t-extra">
          <span>—</span>
          <span>—</span>
        </div>
      `;
      grid.appendChild(tile);
    }
    container.appendChild(grid);
  }
}

// Запуск
(async () => {
  renderStubGrid();
  applyWeatherVisual(WEATHERS.clear); // показываем ясно по умолчанию
})();
</script>
</body>
</html>
